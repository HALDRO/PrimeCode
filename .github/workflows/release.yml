name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify version matches tag
        run: |
          PKG_VERSION="v$(bun -e "console.log(require('./package.json').version)")"
          TAG_VERSION="${{ github.ref_name }}"
          echo "package.json version: $PKG_VERSION"
          echo "Git tag: $TAG_VERSION"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Version mismatch! package.json=$PKG_VERSION, tag=$TAG_VERSION"
            exit 1
          fi

      - name: Lint
        run: bun run lint:biome && bun run lint:tsc

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

      - name: Package VSIX
        run: npx @vscode/vsce package --no-dependencies --out primecode-${{ github.ref_name }}.vsix

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: primecode-${{ github.ref_name }}.vsix
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
